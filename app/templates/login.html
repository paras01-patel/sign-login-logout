{% block title %}Login Page{% endblock %}

{% block content %}

<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #0f766e
    );
    overflow:hidden;
    position:relative;
}

/* ================= PREMIUM BACKGROUND ================= */

body::before{
    content:'';
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    background:rgba(34,197,94,.15);
    top:-200px;
    left:-150px;
    filter:blur(80px);
    animation:float1 8s ease-in-out infinite alternate;
}

body::after{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(59,130,246,.15);
    right:-150px;
    bottom:-150px;
    filter:blur(80px);
    animation:float2 8s ease-in-out infinite alternate;
}

@keyframes float1{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(60px);
    }
}

@keyframes float2{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-60px);
    }
}

/* ================= CONTAINER ================= */

.login-container{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    z-index:1;
}

/* ================= LOGIN BOX ================= */

.login-box{
    width:100%;
    max-width:450px;
    padding:50px 40px;

    border-radius:30px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
    0 20px 50px rgba(0,0,0,.35);

    animation:fadeIn .8s ease;
}

/* ================= LOGO ================= */

.logo{
    width:95px;
    height:95px;

    margin:0 auto 25px;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #22c55e,
        #15803d
    );

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:40px;

    box-shadow:
    0 10px 30px rgba(34,197,94,.45);

    transition:.4s;
}

.logo:hover{
    transform:scale(1.08) rotate(10deg);
}

/* ================= TEXT ================= */

.login-box h1{
    text-align:center;
    color:white;
    font-size:2.5rem;
    margin-bottom:10px;
    letter-spacing:1px;
}

.login-subtitle{
    text-align:center;
    color:#d1d5db;
    margin-bottom:35px;
    font-size:15px;
}

/* ================= INPUTS ================= */

.input-box{
    margin-bottom:22px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    color:white;
    font-weight:600;
    font-size:14px;
}

.input-field{
    position:relative;
}

.input-field input{
    width:100%;
    padding:15px 50px 15px 18px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.15);

    background:rgba(255,255,255,.08);

    color:white;

    outline:none;

    transition:.4s;
}

.input-field input::placeholder{
    color:#cbd5e1;
}

.input-field input:focus{
    border-color:#22c55e;

    background:rgba(255,255,255,.12);

    box-shadow:
    0 0 20px rgba(34,197,94,.35);
}

.input-field i{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#d1d5db;
    font-size:18px;
}

/* ================= OPTIONS ================= */

.form-options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:14px;
}

.remember{
    color:white;
}

.remember input{
    margin-right:5px;
}

.form-options a{
    color:#4ade80;
    text-decoration:none;
    font-weight:600;
}

.form-options a:hover{
    text-decoration:underline;
}

/* ================= BUTTON ================= */

.login-btn{
    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #22c55e,
        #15803d
    );

    color:white;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    transition:.4s;

    box-shadow:
    0 10px 25px rgba(21,128,61,.4);
}

.login-btn:hover{
    transform:translateY(-4px);

    box-shadow:
    0 18px 35px rgba(21,128,61,.5);
}

/* ================= DIVIDER ================= */

.divider{
    margin:25px 0;
    text-align:center;
    position:relative;
    color:#d1d5db;
    font-size:14px;
}

.divider::before{
    content:'';
    position:absolute;
    width:40%;
    height:1px;
    background:rgba(255,255,255,.15);
    left:0;
    top:50%;
}

.divider::after{
    content:'';
    position:absolute;
    width:40%;
    height:1px;
    background:rgba(255,255,255,.15);
    right:0;
    top:50%;
}

/* ================= SOCIAL BUTTONS ================= */

.social-login{
    display:flex;
    gap:15px;
}

.social-btn{
    flex:1;

    padding:13px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.15);

    background:rgba(255,255,255,.08);

    color:white;

    cursor:pointer;

    transition:.4s;
}

.social-btn:hover{
    transform:translateY(-4px);

    background:rgba(255,255,255,.18);
}

/* ================= FOOTER ================= */

.extra-text{
    text-align:center;
    margin-top:30px;
    color:#e5e7eb;
    font-size:15px;
}

.extra-text a{
    color:#4ade80;
    text-decoration:none;
    font-weight:700;
}

.extra-text a:hover{
    text-decoration:underline;
}

/* ================= ANIMATION ================= */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* ================= RESPONSIVE ================= */

@media(max-width:500px){

    .login-box{
        padding:35px 25px;
    }

    .login-box h1{
        font-size:2rem;
    }

    .form-options{
        flex-direction:column;
        gap:10px;
    }

}

</style>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<div class="login-container">

    <div class="login-box">

        <div class="logo">
            <i class="fa-solid fa-user"></i>
        </div>

        <h1>Welcome Back</h1>

        <p class="login-subtitle">
            Login to continue your journey
        </p>

        <form method="POST">

            {% csrf_token %}

            <!-- Username -->

            <div class="input-box">

                <label>Username</label>

                <div class="input-field">

                    <input type="text"
                    name="username"
                    placeholder="Enter Username"
                    required>

                    <i class="fa-solid fa-user"></i>

                </div>

            </div>

            <!-- Password -->

            <div class="input-box">

                <label>Password</label>

                <div class="input-field">

                    <input type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required>

                    <i class="fa-solid fa-lock"></i>

                </div>

            </div>

            <!-- Options -->

            <div class="form-options">

                <label class="remember">
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="/password-reset/">
                    Forgot Password?
                </a>

            </div>

            <!-- Button -->

            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>

        <!-- Divider -->

        <div class="divider">
            OR
        </div>

        <!-- Social Login -->

        <div class="social-login">

            <button class="social-btn">
                <i class="fa-brands fa-google"></i>
            </button>

            <button class="social-btn">
                <i class="fa-brands fa-facebook-f"></i>
            </button>

            <button class="social-btn">
                <i class="fa-brands fa-github"></i>
            </button>

        </div>

        <!-- Footer -->

        <div class="extra-text">

            Don't have an account?

            <a href="/signup/">
                Signup
            </a>

        </div>

    </div>

</div>

{% endblock %}

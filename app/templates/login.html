{% block title %}Login Page{% endblock %}

{% block content %}

<style>
/* Reset & Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
}

/* Container */
.login-container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* Login Card */
.login-box {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08), 0 5px 15px rgba(0, 0, 0, 0.05);
    transition: transform 0.3s ease;
}

.login-box:hover {
    transform: translateY(-5px);
}

/* Heading */
.login-box h1 {
    text-align: center;
    margin-bottom: 10px;
    color: #1b5e20;
    font-size: 2rem;
    font-weight: 700;
}

.login-subtitle {
    text-align: center;
    color: #666;
    font-size: 0.9rem;
    margin-bottom: 30px;
}

/* Input Fields */
.input-box {
    margin-bottom: 22px;
}

.input-box label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #444;
    font-size: 0.9rem;
}

.input-box input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
    color: #333;
    background-color: #fcfcfc;
    transition: all 0.3s ease;
}

/* Input Focus States */
.input-box input:focus {
    border-color: #1b5e20;
    background-color: #fff;
    box-shadow: 0 0 0 4px rgba(27, 94, 32, 0.15);
}

/* Utilities (Forgot Password) */
.form-options {
    display: flex;
    justify-content: flex-end;
    margin-top: -10px;
    margin-bottom: 25px;
}

.form-options a {
    text-decoration: none;
    color: #1b5e20;
    font-size: 0.85rem;
    font-weight: 600;
    transition: color 0.2s;
}

.form-options a:hover {
    color: #2e7d32;
    text-decoration: underline;
}

/* Submit Button */
.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
    color: white;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(27, 94, 32, 0.3);
    transition: all 0.3s ease;
}

.login-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 15px rgba(27, 94, 32, 0.4);
    background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
}

.login-btn:active {
    transform: translateY(1px);
}

/* Extra Footer Text */
.extra-text {
    text-align: center;
    margin-top: 30px;
    color: #666;
    font-size: 0.95rem;
}

.extra-text a {
    text-decoration: none;
    color: #1b5e20;
    font-weight: 700;
    margin-left: 5px;
    transition: color 0.2s;
}

.extra-text a:hover {
    color: #2e7d32;
    text-decoration: underline;
}
</style>

<div class="login-container">

    <div class="login-box">

        <h1>Welcome Back</h1>
        <p class="login-subtitle">Please enter your details to sign in</p>

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter Username" required>
            </div>

            <div class="input-box">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
            </div>

            <div class="form-options">
                <a href="/password-reset/">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>

        <div class="extra-text">
            Don't have an account?
            <a href="/signup/">Signup</a>
        </div>

    </div>

</div>

{% endblock %}

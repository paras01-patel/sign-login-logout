{% block title %}Login Page{% endblock %}

{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#0f172a,#0f766e,#1d4ed8,#0f172a);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    position:relative;
}

/* Animated Background */

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

body::before{
    content:'';
    position:absolute;
    width:450px;
    height:450px;
    background:#22c55e;
    border-radius:50%;
    left:-120px;
    top:-120px;
    filter:blur(120px);
    opacity:.35;
}

body::after{
    content:'';
    position:absolute;
    width:420px;
    height:420px;
    background:#2563eb;
    border-radius:50%;
    right:-120px;
    bottom:-120px;
    filter:blur(120px);
    opacity:.35;
}

/* Floating Dots */

.login-container::before,
.login-container::after{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    background:white;
    border-radius:50%;
    opacity:.4;
    animation:float 7s infinite alternate;
}

.login-container::before{
    top:15%;
    left:15%;
}

.login-container::after{
    bottom:15%;
    right:18%;
}

@keyframes float{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(-60px);
    }

}

.login-container{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
}

/* Card */

.login-box{

    width:100%;
    max-width:460px;

    padding:45px;

    border-radius:30px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(35px);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:

    0 15px 50px rgba(0,0,0,.4);

    position:relative;

    overflow:hidden;

}

.login-box::before{

    content:'';

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.2),
    transparent);

    transition:.8s;

}

.login-box:hover::before{
    left:100%;
}

/* Logo */

.logo{

    width:95px;
    height:95px;

    border-radius:50%;

    margin:auto;

    margin-bottom:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:42px;

    color:white;

    background:linear-gradient(135deg,#22c55e,#15803d);

    box-shadow:0 0 35px rgba(34,197,94,.55);

    transition:.4s;

}

.logo:hover{
    transform:rotate(15deg) scale(1.08);
}

h1{
    text-align:center;
    color:white;
    font-size:2.3rem;
}

.login-subtitle{
    text-align:center;
    color:#d1d5db;
    margin:10px 0 35px;
}

/* Input */

.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    color:white;
    margin-bottom:8px;
    font-weight:600;
}

.input-field{
    position:relative;
}

.input-field input{

    width:100%;

    padding:15px 48px 15px 18px;

    border-radius:15px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.15);

    color:white;

    outline:none;

    transition:.35s;

}

.input-field input::placeholder{
    color:#d1d5db;
}

.input-field input:focus{

    border-color:#22c55e;

    box-shadow:0 0 20px rgba(34,197,94,.35);

}

.input-field i{

    position:absolute;

    right:18px;

    top:50%;

    transform:translateY(-50%);

    color:white;

    cursor:pointer;

}

/* Options */

.form-options{

display:flex;
justify-content:space-between;
margin-bottom:25px;
color:white;
font-size:14px;

}

.form-options a{
    color:#4ade80;
    text-decoration:none;
}

.form-options a:hover{
    text-decoration:underline;
}

/* Button */

.login-btn{

width:100%;

padding:15px;

border:none;

border-radius:15px;

font-size:17px;

font-weight:bold;

cursor:pointer;

background:linear-gradient(135deg,#22c55e,#15803d);

color:white;

transition:.35s;

box-shadow:0 10px 25px rgba(0,0,0,.35);

}

.login-btn:hover{

transform:translateY(-5px);

box-shadow:0 18px 35px rgba(34,197,94,.45);

}

/* Divider */

.divider{

margin:28px 0;

text-align:center;

color:white;

position:relative;

}

.divider:before,
.divider:after{

content:'';

position:absolute;

width:40%;

height:1px;

background:rgba(255,255,255,.2);

top:50%;

}

.divider:before{
left:0;
}

.divider:after{
right:0;
}

/* Social */

.social-login{

display:flex;
gap:15px;

}

.social-btn{

flex:1;

padding:14px;

border:none;

border-radius:15px;

background:rgba(255,255,255,.08);

color:white;

font-size:18px;

cursor:pointer;

transition:.35s;

border:1px solid rgba(255,255,255,.12);

}

.social-btn:hover{

background:#22c55e;

transform:translateY(-5px);

}

/* Footer */

.extra-text{

margin-top:30px;

text-align:center;

color:white;

}

.extra-text a{

color:#4ade80;

text-decoration:none;

font-weight:bold;

}

.extra-text a:hover{
text-decoration:underline;
}

@media(max-width:500px){

.login-box{

padding:30px 25px;

}

.form-options{

flex-direction:column;

gap:10px;

}

}

</style>

<div class="login-container">

<div class="login-box">

<div class="logo">
<i class="fa-solid fa-user"></i>
</div>

<h1>Welcome Back</h1>

<p class="login-subtitle">
Login to continue your journey
</p>

<form method="POST">

{% csrf_token %}

<div class="input-box">

<label>Username</label>

<div class="input-field">

<input
type="text"
name="username"
placeholder="Enter Username"
required>

<i class="fa-solid fa-user"></i>

</div>

</div>

<div class="input-box">

<label>Password</label>

<div class="input-field">

<input
type="password"
id="password"
name="password"
placeholder="Enter Password"
required>

<i class="fa-solid fa-eye" id="togglePassword"></i>

</div>

</div>

<div class="form-options">

<label>
<input type="checkbox">
Remember Me
</label>

<a href="/password-reset/">
Forgot Password?
</a>

</div>

<button class="login-btn">
Sign In
</button>

</form>

<div class="divider">
OR
</div>

<div class="social-login">

<button class="social-btn">
<i class="fa-brands fa-google"></i>
</button>

<button class="social-btn">
<i class="fa-brands fa-facebook-f"></i>
</button>

<button class="social-btn">
<i class="fa-brands fa-github"></i>
</button>

</div>

<div class="extra-text">

Don't have an account?

<a href="/signup/">
Signup
</a>

</div>

</div>

</div>

<script>

const toggle=document.getElementById("togglePassword");
const password=document.getElementById("password");

toggle.onclick=function(){

if(password.type==="password"){

password.type="text";

toggle.classList.remove("fa-eye");

toggle.classList.add("fa-eye-slash");

}else{

password.type="password";

toggle.classList.remove("fa-eye-slash");

toggle.classList.add("fa-eye");

}

}

</script>

{% endblock %}

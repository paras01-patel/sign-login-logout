{% block title %}Login Page{% endblock %}

{% block content %}

<style>

/* ================= GLOBAL ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:
    linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    overflow:hidden;
}

/* Animated Background */

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    top:-150px;
    left:-100px;
    filter:blur(40px);
}

body::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(76,175,80,0.15);
    border-radius:50%;
    bottom:-120px;
    right:-100px;
    filter:blur(40px);
}

/* ================= CONTAINER ================= */

.login-container{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    z-index:1;
}

/* ================= LOGIN BOX ================= */

.login-box{
    width:100%;
    max-width:420px;
    padding:45px 35px;
    border-radius:25px;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:
    0 8px 32px rgba(0,0,0,0.25);

    animation:fadeIn 0.8s ease;
}

/* ================= LOGO ================= */

.logo{
    width:80px;
    height:80px;
    margin:0 auto 20px;
    border-radius:50%;
    background:linear-gradient(135deg,#43a047,#1b5e20);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:35px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

/* ================= TEXT ================= */

.login-box h1{
    text-align:center;
    color:white;
    font-size:2.2rem;
    margin-bottom:10px;
}

.login-subtitle{
    text-align:center;
    color:#dcdcdc;
    margin-bottom:35px;
    font-size:15px;
}

/* ================= INPUTS ================= */

.input-box{
    margin-bottom:22px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    color:white;
    font-weight:600;
    font-size:14px;
}

.input-field{
    position:relative;
}

.input-field input{
    width:100%;
    padding:14px 50px 14px 15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:15px;
    border:1px solid rgba(255,255,255,0.2);
    transition:0.3s;
}

.input-field input::placeholder{
    color:#d5d5d5;
}

.input-field input:focus{
    border-color:#66bb6a;
    box-shadow:0 0 10px rgba(102,187,106,0.5);
    background:rgba(255,255,255,0.2);
}

.input-field i{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#ddd;
    font-size:18px;
}

/* ================= OPTIONS ================= */

.form-options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:14px;
}

.remember{
    color:white;
}

.remember input{
    margin-right:5px;
}

.form-options a{
    color:#81c784;
    text-decoration:none;
    font-weight:600;
}

.form-options a:hover{
    text-decoration:underline;
}

/* ================= BUTTON ================= */

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#43a047,#1b5e20);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.login-btn:hover{
    transform:translateY(-2px);
    background:linear-gradient(135deg,#4caf50,#2e7d32);
}

/* ================= FOOTER ================= */

.extra-text{
    text-align:center;
    margin-top:30px;
    color:#eee;
    font-size:15px;
}

.extra-text a{
    color:#81c784;
    text-decoration:none;
    font-weight:700;
}

.extra-text a:hover{
    text-decoration:underline;
}

/* ================= DIVIDER ================= */

.divider{
    margin:25px 0;
    text-align:center;
    position:relative;
    color:#ddd;
    font-size:14px;
}

.divider::before{
    content:'';
    position:absolute;
    width:40%;
    height:1px;
    background:rgba(255,255,255,0.2);
    left:0;
    top:50%;
}

.divider::after{
    content:'';
    position:absolute;
    width:40%;
    height:1px;
    background:rgba(255,255,255,0.2);
    right:0;
    top:50%;
}

/* ================= SOCIAL BUTTONS ================= */

.social-login{
    display:flex;
    gap:15px;
}

.social-btn{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    background:rgba(255,255,255,0.12);
    color:white;
    cursor:pointer;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.2);
}

.social-btn:hover{
    background:rgba(255,255,255,0.2);
    transform:translateY(-2px);
}

/* ================= ANIMATION ================= */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* ================= RESPONSIVE ================= */

@media(max-width:500px){

    .login-box{
        padding:35px 25px;
    }

    .login-box h1{
        font-size:1.8rem;
    }

}

</style>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<div class="login-container">

    <div class="login-box">

        <div class="logo">
            <i class="fa-solid fa-user"></i>
        </div>

        <h1>Welcome Back</h1>

        <p class="login-subtitle">
            Login to continue your journey
        </p>

        <form method="POST">

            {% csrf_token %}

            <!-- Username -->

            <div class="input-box">

                <label>Username</label>

                <div class="input-field">

                    <input type="text"
                    name="username"
                    placeholder="Enter Username"
                    required>

                    <i class="fa-solid fa-user"></i>

                </div>

            </div>

            <!-- Password -->

            <div class="input-box">

                <label>Password</label>

                <div class="input-field">

                    <input type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required>

                    <i class="fa-solid fa-lock"></i>

                </div>

            </div>

            <!-- Options -->

            <div class="form-options">

                <label class="remember">
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="/password-reset/">
                    Forgot Password?
                </a>

            </div>

            <!-- Button -->

            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>

        <!-- Divider -->

        <div class="divider">
            OR
        </div>

        <!-- Social Login -->

        <div class="social-login">

            <button class="social-btn">
                <i class="fa-brands fa-google"></i>
            </button>

            <button class="social-btn">
                <i class="fa-brands fa-facebook-f"></i>
            </button>

            <button class="social-btn">
                <i class="fa-brands fa-github"></i>
            </button>

        </div>

        <!-- Footer -->

        <div class="extra-text">

            Don't have an account?

            <a href="/signup/">
                Signup
            </a>

        </div>

    </div>

</div>

{% endblock %}
